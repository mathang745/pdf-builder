name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
        pip install --upgrade pip
        pip install cython buildozer

    - name: Build APK with Buildozer
      run: |
        buildozer init
        # Set requirements
        sed -i 's/^requirements = .*/requirements = python3,kivy,pymupdf/' buildozer.spec
        # Accept SDK License
        sed -i 's/# android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec
        # Target modern 64-bit Android architecture (Prevents missing 32-bit wheel error)
        sed -i 's/#android.archs = arm64-v8a, armeabi-v7a/android.archs = arm64-v8a/' buildozer.spec
        # Use python-for-android develop branch to fix pip dry-run issue
        sed -i 's/#p4a.branch = master/p4a.branch = develop/' buildozer.spec
        yes | buildozer -v android debug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: PDF-Booklet-App
        path: bin/*.apk
